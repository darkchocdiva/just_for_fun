<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="450" fill="#0f1320"/>

  <!-- browser bar -->
  <rect width="800" height="36" fill="#131827"/>
  <circle cx="20" cy="18" r="5" fill="#e63946"/><circle cx="38" cy="18" r="5" fill="#f4a261"/><circle cx="56" cy="18" r="5" fill="#2a9d8f"/>
  <rect x="90" y="8" width="320" height="20" rx="10" fill="#1e2235"/>
  <text x="104" y="22" fill="#9aa0b4" font-size="11">salesview.local/dashboard</text>

  <!-- sidebar -->
  <rect x="0" y="36" width="130" height="414" fill="#131827"/>
  <text x="20" y="68" fill="#ffffff" font-size="16" font-weight="700">Sales<tspan fill="#ff6b6b">View</tspan></text>
  <rect x="10" y="90" width="110" height="28" rx="8" fill="#e63946"/>
  <text x="24" y="109" fill="#fff" font-size="12" font-weight="700">Dashboard</text>
  <text x="24" y="142" fill="#cfd3e0" font-size="12">Reports</text>
  <text x="24" y="170" fill="#cfd3e0" font-size="12">Customers</text>
  <text x="24" y="198" fill="#cfd3e0" font-size="12">Products</text>
  <text x="24" y="226" fill="#cfd3e0" font-size="12">Settings</text>

  <!-- header -->
  <text x="150" y="68" fill="#ffffff" font-size="18" font-weight="700">Sales Overview</text>
  <rect x="560" y="50" width="100" height="26" rx="8" fill="#1e2235"/>
  <text x="572" y="67" fill="#cfd3e0" font-size="11">Last 30 days ▾</text>
  <rect x="670" y="50" width="100" height="26" rx="8" fill="#e63946"/>
  <text x="684" y="67" fill="#fff" font-size="11" font-weight="700">Export CSV</text>

  <!-- stat cards -->
  <rect x="150" y="90" width="148" height="72" rx="10" fill="#131827" stroke="#1e2235"/>
  <text x="164" y="112" fill="#9aa0b4" font-size="11">Total Sales</text>
  <text x="164" y="138" fill="#fff" font-size="20" font-weight="700">$48,200</text>
  <text x="164" y="154" fill="#2a9d8f" font-size="10">▲ 12.4% vs last month</text>

  <rect x="310" y="90" width="148" height="72" rx="10" fill="#131827" stroke="#1e2235"/>
  <text x="324" y="112" fill="#9aa0b4" font-size="11">Orders</text>
  <text x="324" y="138" fill="#fff" font-size="20" font-weight="700">1,284</text>
  <text x="324" y="154" fill="#2a9d8f" font-size="10">▲ 8.1% vs last month</text>

  <rect x="470" y="90" width="148" height="72" rx="10" fill="#131827" stroke="#1e2235"/>
  <text x="484" y="112" fill="#9aa0b4" font-size="11">New Customers</text>
  <text x="484" y="138" fill="#fff" font-size="20" font-weight="700">342</text>
  <text x="484" y="154" fill="#2a9d8f" font-size="10">▲ 5.6% vs last month</text>

  <rect x="630" y="90" width="140" height="72" rx="10" fill="#131827" stroke="#1e2235"/>
  <text x="644" y="112" fill="#9aa0b4" font-size="11">Refund Rate</text>
  <text x="644" y="138" fill="#fff" font-size="20" font-weight="700">2.3%</text>
  <text x="644" y="154" fill="#e63946" font-size="10">▼ 0.4% vs last month</text>

  <!-- bar chart -->
  <rect x="150" y="178" width="340" height="256" rx="10" fill="#131827" stroke="#1e2235"/>
  <text x="166" y="202" fill="#fff" font-size="13" font-weight="700">Monthly Sales ($)</text>
  <g stroke="#1e2235">
    <line x1="200" y1="226" x2="476" y2="226"/>
    <line x1="200" y1="271" x2="476" y2="271"/>
    <line x1="200" y1="316" x2="476" y2="316"/>
    <line x1="200" y1="361" x2="476" y2="361"/>
    <line x1="200" y1="396" x2="476" y2="396"/>
  </g>
  <g fill="#9aa0b4" font-size="9" text-anchor="end">
    <text x="194" y="229">60k</text><text x="194" y="274">45k</text><text x="194" y="319">30k</text><text x="194" y="364">15k</text><text x="194" y="399">0</text>
  </g>
  <rect x="212" y="340" width="26" height="56" rx="3" fill="#e63946"/>
  <rect x="250" y="318" width="26" height="78" rx="3" fill="#e63946"/>
  <rect x="288" y="328" width="26" height="68" rx="3" fill="#e63946"/>
  <rect x="326" y="296" width="26" height="100" rx="3" fill="#e63946"/>
  <rect x="364" y="276" width="26" height="120" rx="3" fill="#ff6b6b"/>
  <rect x="402" y="258" width="26" height="138" rx="3" fill="#ff6b6b"/>
  <rect x="440" y="238" width="26" height="158" rx="3" fill="#ff6b6b"/>
  <g fill="#9aa0b4" font-size="9" text-anchor="middle">
    <text x="225" y="412">Apr</text><text x="263" y="412">May</text><text x="301" y="412">Jun</text><text x="339" y="412">Jul</text><text x="377" y="412">Aug</text><text x="415" y="412">Sep</text><text x="453" y="412">Oct</text>
  </g>

  <!-- top products -->
  <rect x="502" y="178" width="268" height="256" rx="10" fill="#131827" stroke="#1e2235"/>
  <text x="518" y="202" fill="#fff" font-size="13" font-weight="700">Top Products</text>

  <text x="518" y="228" fill="#cfd3e0" font-size="11">Wireless Headphones</text><text x="700" y="228" fill="#fff" font-size="11" font-weight="700">$9,840</text>
  <rect x="518" y="236" width="236" height="6" rx="3" fill="#1e2235"/><rect x="518" y="236" width="236" height="6" rx="3" fill="#ff6b6b"/>

  <text x="518" y="268" fill="#cfd3e0" font-size="11">Smart Watch</text><text x="700" y="268" fill="#fff" font-size="11" font-weight="700">$7,320</text>
  <rect x="518" y="276" width="236" height="6" rx="3" fill="#1e2235"/><rect x="518" y="276" width="176" height="6" rx="3" fill="#ff6b6b"/>

  <text x="518" y="308" fill="#cfd3e0" font-size="11">Leather Backpack</text><text x="700" y="308" fill="#fff" font-size="11" font-weight="700">$5,610</text>
  <rect x="518" y="316" width="236" height="6" rx="3" fill="#1e2235"/><rect x="518" y="316" width="135" height="6" rx="3" fill="#ff6b6b"/>

  <text x="518" y="348" fill="#cfd3e0" font-size="11">USB-C Cable (2-pack)</text><text x="700" y="348" fill="#fff" font-size="11" font-weight="700">$3,240</text>
  <rect x="518" y="356" width="236" height="6" rx="3" fill="#1e2235"/><rect x="518" y="356" width="78" height="6" rx="3" fill="#ff6b6b"/>

  <text x="518" y="388" fill="#cfd3e0" font-size="11">Desk Lamp</text><text x="700" y="388" fill="#fff" font-size="11" font-weight="700">$2,190</text>
  <rect x="518" y="396" width="236" height="6" rx="3" fill="#1e2235"/><rect x="518" y="396" width="53" height="6" rx="3" fill="#ff6b6b"/>
</svg>
